<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 Dashboard – ประวัติการจำลองการเงิน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen">
  <div class="max-w-5xl mx-auto py-10 px-6">
    <h1 class="text-3xl font-bold text-center text-blue-700 mb-8">
      📈 Dashboard – ประวัติการจำลองการเงิน
    </h1>

    <!-- 🔹 กล่องพิมพ์ชื่อผู้ใช้ -->
    <div class="mb-6 flex justify-center gap-3">
      <input id="userName" type="text"
        placeholder="พิมพ์ชื่อผู้ใช้ เช่น นาโน"
        class="border p-2 rounded-lg w-72 text-center shadow focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      <button onclick="loadHistory()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow">
        แสดงข้อมูล
      </button>
    </div>

    <!-- 🔹 ตารางข้อมูล -->
    <div id="historyTable" class="bg-white p-6 rounded-2xl shadow hidden">
      <h2 class="text-xl font-semibold text-blue-700 mb-4">📋 ประวัติการจำลอง</h2>
      <table class="w-full border-collapse border border-gray-300">
        <thead class="bg-blue-100">
          <tr>
            <th class="border p-2">เดือน</th>
            <th class="border p-2">รายได้ (บาท)</th>
            <th class="border p-2">รายจ่ายรวม (บาท)</th>
            <th class="border p-2">คงเหลือ (บาท)</th>
            <th class="border p-2">วันที่บันทึก</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>

    <!-- 🔹 กราฟ -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-8">
      <div class="bg-white p-6 rounded-2xl shadow">
        <h3 class="text-lg font-semibold text-center text-blue-700 mb-2">🧾 สัดส่วนรายจ่าย</h3>
        <canvas id="pieChart"></canvas>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow">
        <h3 class="text-lg font-semibold text-center text-blue-700 mb-2">💰 รายได้ - รายจ่ายต่อเดือน</h3>
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <div class="text-center mt-10">
      <a href="index.html" class="text-blue-600 hover:underline">⬅ กลับไปหน้าจำลอง</a>
    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8001";

    // โหลดประวัติจากชื่อผู้ใช้
    async function loadHistory() {
      const name = document.getElementById("userName").value.trim();
      if (!name) {
        alert("กรุณาพิมพ์ชื่อผู้ใช้ก่อน");
        return;
      }

      try {
        const res = await fetch(`${API_URL}/history/${encodeURIComponent(name)}`);
        if (!res.ok) {
          alert("❌ ไม่พบข้อมูลของผู้ใช้ '" + name + "'");
          throw new Error("ไม่พบข้อมูล");
        }

        const data = await res.json();
        console.log("📄 ข้อมูลประวัติ:", data);

        document.getElementById("historyTable").classList.remove("hidden");
        const tbody = document.getElementById("historyBody");
        tbody.innerHTML = "";

        data.records.forEach(r => {
          const row = `
            <tr class="border-b hover:bg-gray-50">
              <td class="p-2 text-center">${r.month}</td>
              <td class="p-2 text-center">${r.income.toLocaleString()}</td>
              <td class="p-2 text-center">${r.total_expense.toLocaleString()}</td>
              <td class="p-2 text-center">${r.balance.toLocaleString()}</td>
              <td class="p-2 text-center">${r.created_at}</td>
            </tr>`;
          tbody.innerHTML += row;
        });

        // ใช้ record ล่าสุดสร้างกราฟ
        const last = data.records[data.records.length - 1];
        if (last) drawCharts(name, last, data.records);
      } catch (err) {
        console.error("โหลดประวัติผู้ใช้ล้มเหลว:", err);
      }
    }

    // วาดกราฟ
    function drawCharts(name, lastRecord, records) {
      const ctx1 = document.getElementById("pieChart").getContext("2d");
      const ctx2 = document.getElementById("barChart").getContext("2d");

      const expenses = {
        บ้าน: lastRecord.house || 0,
        รถ: lastRecord.car || 0,
        อาหาร: lastRecord.food || 0,
        ออม: lastRecord.saving || 0,
        ท่องเที่ยว: lastRecord.travel || 0
      };

      new Chart(ctx1, {
        type: "pie",
        data: {
          labels: Object.keys(expenses),
          datasets: [{
            data: Object.values(expenses),
            backgroundColor: ["#60a5fa", "#34d399", "#fbbf24", "#f87171", "#a78bfa"]
          }]
        },
        options: { plugins: { legend: { position: "bottom" } } }
      });

      new Chart(ctx2, {
        type: "bar",
        data: {
          labels: records.map(r => r.month),
          datasets: [
            {
              label: "รายได้",
              data: records.map(r => r.income),
              backgroundColor: "#34d399"
            },
            {
              label: "รายจ่ายรวม",
              data: records.map(r => r.total_expense),
              backgroundColor: "#f87171"
            }
          ]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: "bottom" } },
          scales: { y: { beginAtZero: true, title: { display: true, text: "บาท" } } }
        }
      });
    }
  </script>
</body>
</html>
