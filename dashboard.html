<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 Dashboard – ประวัติการจำลองการเงิน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap');
    body {
      font-family: 'Noto Sans Thai', sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f0f9ff 100%);
      color: #1e293b;
      min-height: 100vh;
    }
    h1 {
      background: linear-gradient(90deg, #2563eb, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    button {
      background: linear-gradient(90deg, #2563eb, #9333ea);
      color: white;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(59,130,246,0.3);
      transition: all 0.3s;
    }
    button:hover { transform: translateY(-2px); }
    .panel {
      background: rgba(255,255,255,0.85);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    }
    table { border-collapse: collapse; width: 100%; }
    th {
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      color: white;
      padding: 10px;
    }
    td { background: #fff; padding: 8px; text-align: center; }
    tr:hover td { background: #f0f9ff; }
  </style>
</head>

<body class="text-gray-800">
  <a href="index.html" class="absolute top-5 left-5 bg-gradient-to-r from-blue-500 to-purple-600 text-white px-4 py-2 rounded-lg shadow-md">🏠 กลับหน้าหลัก</a>

  <div class="max-w-6xl mx-auto py-10 px-6">
    <h1 class="text-3xl font-bold text-center mb-8">📈 Dashboard – ประวัติการจำลองการเงิน</h1>

    <div class="mb-6 flex justify-center gap-3">
      <input id="userName" type="text" placeholder="พิมพ์ชื่อผู้ใช้ เช่น นายเอ" class="border border-gray-300 rounded-lg px-3 py-2 text-center" />
      <button onclick="loadHistory()">แสดงข้อมูล</button>
    </div>

    <div id="historyTable" class="panel p-6 hidden">
      <h2 class="text-xl font-semibold text-blue-700 mb-4">📋 ประวัติการจำลอง</h2>
      <table>
        <thead>
          <tr>
            <th>รายได้</th>
            <th>รายจ่ายรวม</th>
            <th>คงเหลือ</th>
            <th>วันที่บันทึก</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-8">
      <div class="panel p-6">
        <h3 class="text-lg font-semibold text-center text-blue-700 mb-2">🍩 สัดส่วนรายจ่าย</h3>
        <canvas id="doughnutChart"></canvas>
      </div>
      <div class="panel p-6">
        <h3 class="text-lg font-semibold text-center text-blue-700 mb-2">💰 รายได้ - รายจ่ายต่อเดือน</h3>
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <div class="panel p-6 mt-10">
      <h3 class="text-lg font-semibold text-center text-blue-700 mb-2">📊 ค่าใช้จ่ายแต่ละหมวด</h3>
      <canvas id="expenseDetailChart"></canvas>
    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8001";
    const fmt = n => Number(n || 0).toLocaleString("th-TH") + " บาท";

    async function loadHistory() {
      const name = document.getElementById("userName").value.trim();
      if (!name) return alert("⚠️ กรุณากรอกชื่อก่อน");

      try {
        const res = await fetch(`${API_URL}/history/${encodeURIComponent(name)}`);
        if (!res.ok) throw new Error("ไม่พบผู้ใช้");
        const data = await res.json();
        if (!data.records?.length) return alert("ยังไม่มีข้อมูล");

        document.getElementById("historyTable").classList.remove("hidden");
        const tbody = document.getElementById("historyBody");
        tbody.innerHTML = data.records.map(r => `
          <tr>
            <td>${fmt(r.income)}</td>
            <td>${fmt(r.total_expense)}</td>
            <td>${fmt(r.balance)}</td>
            <td>${r.created_at}</td>
          </tr>`).join("");

        drawCharts(data.records);
      } catch (err) {
        console.error(err);
        alert("❌ โหลดข้อมูลไม่สำเร็จ");
      }
    }

    // ===============================
    // 🎨 ฟังก์ชันวาดกราฟทั้งหมด
    // ===============================
    function drawCharts(records) {
      if (!records || records.length === 0) return;

      // ล้าง canvas เดิมทุกครั้งก่อนวาด
      ["doughnutChart", "barChart", "expenseDetailChart"].forEach(id => {
        const c = document.getElementById(id);
        const n = c.cloneNode(true);
        c.parentNode.replaceChild(n, c);
      });

      const ctx1 = document.getElementById("doughnutChart").getContext("2d");
      const ctx2 = document.getElementById("barChart").getContext("2d");
      const ctx3 = document.getElementById("expenseDetailChart").getContext("2d");

      const last = records[0]; // ใช้ข้อมูลล่าสุดสุดท้ายในตาราง
      const expenses = {
        บ้าน: last.house || 5000,
        รถ: last.car || 3000,
        อาหาร: last.food || 4000,
        ออม: last.saving || 2000,
        ท่องเที่ยว: last.travel || 1500,
      };

      const totalExpense = Object.values(expenses).reduce((a, b) => a + b, 0);
      const colors = ["#2563eb", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6"];

      // 🍩 กราฟ Doughnut
      new Chart(ctx1, {
        type: "doughnut",
        data: {
          labels: Object.keys(expenses),
          datasets: [{
            data: Object.values(expenses),
            backgroundColor: colors,
            borderWidth: 3,
            hoverOffset: 15,
          }],
        },
        options: {
          cutout: "70%",
          plugins: {
            legend: { position: "right" },
            title: { display: true, text: "🍩 สัดส่วนรายจ่าย (%)" },
          },
        },
      });

      // 💰 กราฟ Bar Chart รายได้ - รายจ่าย
      new Chart(ctx2, {
        type: "bar",
        data: {
          labels: records.map((r, i) => r.month || `ครั้งที่ ${i + 1}`),
          datasets: [
            { label: "รายได้", data: records.map(r => r.income), backgroundColor: "#16a34a" },
            { label: "รายจ่ายรวม", data: records.map(r => r.total_expense), backgroundColor: "#ef4444" },
          ],
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: "bottom" },
            title: { display: true, text: "💰 รายได้ - รายจ่ายต่อเดือน" },
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { callback: v => v.toLocaleString("th-TH") },
              title: { display: true, text: "บาท" }
            }
          }
        },
      });

      // 📊 กราฟแนวนอน (ค่าใช้จ่ายแต่ละหมวด)
      const gradient = ctx3.createLinearGradient(0, 0, 600, 0);
      gradient.addColorStop(0, "#2563eb");
      gradient.addColorStop(0.3, "#16a34a");
      gradient.addColorStop(0.7, "#f59e0b");
      gradient.addColorStop(1, "#ef4444");

      new Chart(ctx3, {
        type: "bar",
        data: {
          labels: Object.keys(expenses),
          datasets: [{
            data: Object.values(expenses),
            backgroundColor: gradient,
            borderRadius: 8,
          }],
        },
        options: {
          indexAxis: "y",
          plugins: {
            legend: { display: false },
            title: { display: true, text: "📊 ค่าใช้จ่ายแต่ละหมวด" },
          },
          scales: {
            x: { beginAtZero: true, title: { display: true, text: "บาท" } },
          },
        },
      });
    }
  </script>
</body>
</html>
